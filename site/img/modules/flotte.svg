<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="flotte-title">
  <title id="flotte-title">Illustration Gestion de flotte</title>
  <defs>
    <linearGradient id="flotte-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffbea"/><stop offset="1" stop-color="#fbefc6"/></linearGradient>
    <linearGradient id="flotte-green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2fc06f"/><stop offset="1" stop-color="#006830"/></linearGradient>
    <linearGradient id="flotte-white" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe6ee"/></linearGradient>
    <linearGradient id="flotte-blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f8bf0"/><stop offset="1" stop-color="#1f56c2"/></linearGradient>
    <linearGradient id="flotte-orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb070"/><stop offset="1" stop-color="#e86a1a"/></linearGradient>
    <g id="flotte-wheel"><circle r="20" fill="#1a2433"/><circle r="8" fill="#b6c3d1"/></g>
    <path id="flotte-spark" d="M0-12Q0 0 12 0Q0 0 0 12Q0 0-12 0Q0 0 0-12Z"/>
  </defs>
  <rect width="800" height="500" rx="36" fill="url(#flotte-bg)"/>
  <circle cx="400" cy="120" r="80" fill="#fdef42" opacity=".3"/>
  <g fill="#f5c400" opacity=".45"><circle cx="360" cy="60" r="4"/><circle cx="380" cy="60" r="4"/><circle cx="400" cy="60" r="4"/><circle cx="360" cy="80" r="4"/><circle cx="380" cy="80" r="4"/><circle cx="400" cy="80" r="4"/></g>
  <!-- ground -->
  <rect x="0" y="392" width="800" height="108" fill="#e9dca8" opacity=".6"/>
  <rect x="30" y="398" width="740" height="36" rx="18" fill="#3a4658"/>
  <path d="M60 416H740" stroke="#fdef42" stroke-width="3" stroke-dasharray="20 16"/>
  <!-- maintenance badge -->
  <circle cx="160" cy="130" r="66" fill="#1a2433" opacity=".1" transform="translate(6 8)"/>
  <circle cx="160" cy="130" r="66" fill="#fff"/>
  <g transform="translate(160 130)">
    <path fill="#00853f" fill-rule="evenodd" d="M-6-40h12l3 10 8 3 9-5 9 9-5 9 3 8 10 3v12l-10 3-3 8 5 9-9 9-9-5-8 3-3 10h-12l-3-10-8-3-9 5-9-9 5-9-3-8-10-3v-12l10-3 3-8-5-9 9-9 9 5 8-3ZM0-14a14 14 0 1 0 0.1 0Z"/>
    <g transform="rotate(45)">
      <rect x="-6" y="-46" width="12" height="70" rx="6" fill="#ff8a3d"/>
      <path d="M-14-50a14 14 0 0 0 28 0v-8h-8v8h-12v-8h-8Z" fill="#ff8a3d" transform="translate(0 6)"/>
    </g>
  </g>
  <!-- checklist -->
  <g transform="rotate(5 640 140)">
    <rect x="566" y="46" width="150" height="190" rx="18" fill="#1a2433" opacity=".12" transform="translate(6 8)"/>
    <rect x="566" y="46" width="150" height="190" rx="18" fill="#fff"/>
    <rect x="610" y="36" width="62" height="22" rx="8" fill="#1a2433"/>
    <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="586" y="80" width="22" height="22" rx="6" fill="#e6f5ec" stroke="#00853f" stroke-width="2"/><path d="M591 91l5 5 9-10" stroke="#00853f"/>
      <rect x="586" y="120" width="22" height="22" rx="6" fill="#e6f5ec" stroke="#00853f" stroke-width="2"/><path d="M591 131l5 5 9-10" stroke="#00853f"/>
      <rect x="586" y="160" width="22" height="22" rx="6" fill="#e6f5ec" stroke="#00853f" stroke-width="2"/><path d="M591 171l5 5 9-10" stroke="#00853f"/>
      <rect x="586" y="200" width="22" height="22" rx="6" fill="#fff3e8" stroke="#ff8a3d" stroke-width="2"/>
    </g>
    <g fill="#dfe6ee"><rect x="620" y="86" width="76" height="10" rx="5"/><rect x="620" y="126" width="60" height="10" rx="5"/><rect x="620" y="166" width="70" height="10" rx="5"/><rect x="620" y="206" width="52" height="10" rx="5"/></g>
  </g>
  <path d="M232 150Q400 230 560 150" fill="none" stroke="#1a2433" stroke-width="2.5" stroke-dasharray="6 8" opacity=".35"/>
  <!-- truck -->
  <ellipse cx="185" cy="400" rx="150" ry="9" fill="#1a2433" opacity=".25"/>
  <rect x="46" y="262" width="190" height="116" rx="10" fill="url(#flotte-white)"/>
  <rect x="46" y="340" width="190" height="14" fill="#00853f"/>
  <rect x="70" y="282" width="140" height="40" rx="8" fill="#00853f" opacity=".1"/>
  <path d="M244 296h44q12 0 18 10l20 30v30q0 12-12 12h-70Z" fill="url(#flotte-green)"/>
  <path d="M256 306h30q6 0 10 6l12 20h-52Z" fill="#cfe3ff"/>
  <rect x="236" y="368" width="96" height="12" rx="4" fill="#1a2433"/>
  <use href="#flotte-wheel" x="92" y="384"/><use href="#flotte-wheel" x="142" y="384"/><use href="#flotte-wheel" x="290" y="384"/>
  <!-- pickup -->
  <ellipse cx="455" cy="400" rx="105" ry="8" fill="#1a2433" opacity=".25"/>
  <path d="M360 334h80l14-30q4-8 14-8h40q10 0 16 8l18 28q14 2 14 16v22q0 6-6 6H366q-6 0-6-6Z" fill="url(#flotte-orange)"/>
  <path d="M466 306h18v26h-30ZM490 306h12q6 0 10 6l12 20h-34Z" fill="#cfe3ff"/>
  <rect x="360" y="326" width="84" height="8" rx="3" fill="#c45410"/>
  <rect x="540" y="350" width="12" height="8" rx="3" fill="#fdef42"/>
  <use href="#flotte-wheel" x="398" y="384"/><use href="#flotte-wheel" x="512" y="384"/>
  <!-- car -->
  <ellipse cx="670" cy="400" rx="100" ry="8" fill="#1a2433" opacity=".25"/>
  <path d="M584 352q0-16 16-18l26-24q8-6 18-6h50q12 0 20 8l20 22q24 2 24 20v14q0 6-6 6H590q-6 0-6-6Z" fill="url(#flotte-blue)"/>
  <path d="M632 312h28v22h-48ZM668 312h28q6 0 10 4l16 18h-54Z" fill="#dfeaff"/>
  <rect x="738" y="350" width="14" height="8" rx="3" fill="#fdef42"/>
  <use href="#flotte-wheel" x="622" y="384"/><use href="#flotte-wheel" x="716" y="384"/>
  <!-- status dots -->
  <circle cx="140" cy="244" r="10" fill="#2fc06f"/><path d="M135 244l4 4 7-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="455" cy="276" r="10" fill="#2fc06f"/><path d="M450 276l4 4 7-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="670" cy="282" r="10" fill="#ff8a3d"/><rect x="668" y="276" width="4" height="7" rx="2" fill="#fff"/><circle cx="670" cy="287" r="2" fill="#fff"/>
  <use href="#flotte-spark" x="300" y="80" fill="#e31b23"/>
  <use href="#flotte-spark" x="500" y="230" fill="#2f6fde"/>
  <use href="#flotte-spark" x="760" y="250" fill="#00853f"/>
  <circle cx="60" cy="230" r="5" fill="#f5c400"/>
</svg>
