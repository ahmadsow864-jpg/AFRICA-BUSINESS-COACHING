<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="gps-title">
  <title id="gps-title">Illustration Géolocalisation GPS</title>
  <defs>
    <linearGradient id="gps-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef5fe"/><stop offset="1" stop-color="#d9e6f9"/></linearGradient>
    <linearGradient id="gps-pin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5a50"/><stop offset="1" stop-color="#c5121a"/></linearGradient>
    <linearGradient id="gps-panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f8bf0"/><stop offset="1" stop-color="#1f56c2"/></linearGradient>
    <clipPath id="gps-clip"><path d="M140 180L300 150L460 180L620 150V420L460 450L300 420L140 450Z"/></clipPath>
    <path id="gps-spark" d="M0-12Q0 0 12 0Q0 0 0 12Q0 0-12 0Q0 0 0-12Z"/>
  </defs>
  <circle cx="110" cy="100" r="64" fill="#cfe0f8" opacity=".8"/>
  <g fill="#2f6fde" opacity=".22"><circle cx="60" cy="400" r="4"/><circle cx="80" cy="400" r="4"/><circle cx="100" cy="400" r="4"/><circle cx="60" cy="420" r="4"/><circle cx="80" cy="420" r="4"/><circle cx="100" cy="420" r="4"/></g>
  <!-- map -->
  <path d="M152 194L312 164L472 194L632 164V434L472 464L312 434L152 464Z" fill="#1a2433" opacity=".12"/>
  <path d="M140 180L300 150V420L140 450Z" fill="#f2f8f3"/>
  <path d="M300 150L460 180V450L300 420Z" fill="#e3f0e7"/>
  <path d="M460 180L620 150V420L460 450Z" fill="#f2f8f3"/>
  <g clip-path="url(#gps-clip)">
    <ellipse cx="220" cy="250" rx="50" ry="34" fill="#b9e3c8"/>
    <ellipse cx="560" cy="380" rx="60" ry="36" fill="#b9e3c8"/>
    <path d="M120 360Q260 330 330 380T640 330" fill="none" stroke="#9cc3ff" stroke-width="22"/>
    <g fill="none" stroke="#fff" stroke-width="10"><path d="M120 300L640 240"/><path d="M380 120L420 480"/><path d="M200 120L250 480"/><path d="M120 410L640 380"/></g>
    <g fill="#dfe6ee"><rect x="320" y="200" width="40" height="30" rx="4"/><rect x="440" y="290" width="44" height="34" rx="4"/><rect x="520" y="200" width="50" height="26" rx="4"/><rect x="270" y="320" width="36" height="28" rx="4"/></g>
  </g>
  <path d="M300 150V420M460 180V450" stroke="#1a2433" stroke-width="1.5" opacity=".12"/>
  <!-- route -->
  <path d="M196 410C230 340 300 360 330 300S420 250 470 270 530 240 548 214" fill="none" stroke="#00853f" stroke-width="10" stroke-linecap="round" opacity=".25"/>
  <path d="M196 410C230 340 300 360 330 300S420 250 470 270 530 240 548 214" fill="none" stroke="#00853f" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 10"/>
  <circle cx="196" cy="410" r="12" fill="#fff" stroke="#00853f" stroke-width="5"/>
  <!-- vehicle (top view) -->
  <g transform="translate(330 300) rotate(-55)">
    <rect x="-26" y="-14" width="52" height="28" rx="9" fill="#ff8a3d"/>
    <rect x="-8" y="-11" width="16" height="22" rx="4" fill="#ffd1ad"/>
    <rect x="10" y="-11" width="8" height="22" rx="3" fill="#1a2433" opacity=".7"/>
    <rect x="-20" y="-11" width="7" height="22" rx="3" fill="#1a2433" opacity=".5"/>
  </g>
  <!-- big pin -->
  <ellipse cx="548" cy="214" rx="26" ry="8" fill="#1a2433" opacity=".25"/>
  <path d="M548 210C536 186 504 160 504 126A44 44 0 1 1 592 126C592 160 560 186 548 210Z" fill="url(#gps-pin)"/>
  <circle cx="548" cy="126" r="18" fill="#fff"/>
  <circle cx="548" cy="126" r="8" fill="#e31b23"/>
  <path d="M516 110a34 34 0 0 1 20-22" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".5"/>
  <!-- satellite -->
  <g transform="rotate(-30 690 100)">
    <rect x="600" y="86" width="56" height="28" rx="4" fill="url(#gps-panel)"/>
    <rect x="724" y="86" width="56" height="28" rx="4" fill="url(#gps-panel)"/>
    <g stroke="#fff" stroke-width="1.5" opacity=".5"><path d="M619 86v28M638 86v28M743 86v28M762 86v28M600 100h56M724 100h56"/></g>
    <rect x="656" y="98" width="68" height="4" fill="#9aa7b8"/>
    <rect x="670" y="78" width="40" height="44" rx="10" fill="#fdef42"/>
    <rect x="678" y="88" width="24" height="10" rx="3" fill="#f5a400"/>
    <path d="M690 122v12" stroke="#9aa7b8" stroke-width="4"/>
    <path d="M676 146a14 10 0 0 1 28 0Z" fill="#dfe6ee"/>
  </g>
  <g fill="none" stroke="#2f6fde" stroke-width="4" stroke-linecap="round" opacity=".6">
    <path d="M630 150q-12 14-8 34"/><path d="M612 132q-24 26-14 60"/><path d="M594 114q-34 38-18 88" opacity=".6"/>
  </g>
  <use href="#gps-spark" x="420" y="90" fill="#f5c400"/>
  <use href="#gps-spark" x="720" y="300" fill="#00853f"/>
  <use href="#gps-spark" x="90" y="260" fill="#e31b23"/>
  <circle cx="700" cy="400" r="6" fill="#ff8a3d" opacity=".6"/><circle cx="260" cy="90" r="5" fill="#2f6fde" opacity=".5"/>
</svg>
