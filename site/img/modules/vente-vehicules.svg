  </g>
  <use href="#vente-vehicules-spark" x="330" y="230" fill="#fdef42"/>
  <use href="#vente-vehicules-spark" x="600" y="270" fill="#fff"/>
  <use href="#vente-vehicules-spark" x="720" y="80" fill="#00853f"/>
  <use href="#vente-vehicules-spark" x="60" y="300" fill="#2f6fde"/>
  <circle cx="420" cy="80" r="5" fill="#ff8a3d" opacity=".7"/><circle cx="740" cy="320" r="5" fill="#e31b23" opacity=".5"/>
