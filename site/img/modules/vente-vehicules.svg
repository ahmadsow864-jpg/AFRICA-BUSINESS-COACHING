<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="vente-vehicules-title">
  <title id="vente-vehicules-title">Illustration Vente de véhicules</title>
  <defs>
    <linearGradient id="vente-vehicules-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f6fb"/><stop offset="1" stop-color="#e1e7f2"/></linearGradient>
    <linearGradient id="vente-vehicules-car" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5a50"/><stop offset=".6" stop-color="#e31b23"/><stop offset="1" stop-color="#a80e14"/></linearGradient>
    <linearGradient id="vente-vehicules-pod" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1a2433"/><stop offset=".5" stop-color="#3b4c69"/><stop offset="1" stop-color="#1a2433"/></linearGradient>
    <linearGradient id="vente-vehicules-light" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdef42" stop-opacity=".55"/><stop offset="1" stop-color="#fdef42" stop-opacity="0"/></linearGradient>
    <linearGradient id="vente-vehicules-tag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb070"/><stop offset="1" stop-color="#ff8a3d"/></linearGradient>
    <linearGradient id="vente-vehicules-glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset="1" stop-color="#cfe0f8" stop-opacity=".9"/></linearGradient>
    <path id="vente-vehicules-spark" d="M0-12Q0 0 12 0Q0 0 0 12Q0 0-12 0Q0 0 0-12Z"/>
  </defs>
  <!-- showroom windows -->
  <g fill="url(#vente-vehicules-glass)">
    <rect x="70" y="60" width="140" height="290" rx="12"/><rect x="226" y="60" width="140" height="290" rx="12"/>
    <rect x="382" y="60" width="140" height="290" rx="12"/><rect x="538" y="60" width="140" height="290" rx="12"/>
  </g>
  <g stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".8"><path d="M100 120l40-40M260 140l50-50M420 110l30-30M570 150l60-60"/></g>
  <rect x="0" y="350" width="800" height="150" fill="#d3dbe8"/>
  <path d="M0 350H800" stroke="#c0cadb" stroke-width="6"/>
  <!-- spotlights -->
  <path d="M250 40L150 380H350Z" fill="url(#vente-vehicules-light)"/>
  <path d="M550 40L450 380H650Z" fill="url(#vente-vehicules-light)"/>
  <rect x="234" y="28" width="32" height="20" rx="6" fill="#1a2433"/><rect x="534" y="28" width="32" height="20" rx="6" fill="#1a2433"/>
  <!-- podium -->
  <ellipse cx="400" cy="420" rx="250" ry="36" fill="#1a2433" opacity=".2"/>
  <path d="M160 380v24a240 34 0 0 0 480 0v-24Z" fill="url(#vente-vehicules-pod)"/>
  <ellipse cx="400" cy="380" rx="240" ry="34" fill="#e9eef5"/>
  <ellipse cx="400" cy="380" rx="200" ry="24" fill="none" stroke="#fdef42" stroke-width="3" opacity=".8"/>
  <!-- car -->
  <ellipse cx="400" cy="378" rx="190" ry="12" fill="#1a2433" opacity=".25"/>
  <path d="M220 330q0-26 26-32l60-14 50-38q14-10 32-10h96q20 0 34 12l44 36q58 6 70 24q10 12 10 28v18q0 8-8 8H228q-8 0-8-8Z" fill="url(#vente-vehicules-car)"/>
  <path d="M362 252q8-6 18-6h48v44h-96ZM438 246h44q12 0 22 8l34 36h-100Z" fill="#cfe3ff"/>
  <path d="M362 252l-30 38h20l30-38ZM448 246l-14 44h14l14-44Z" fill="#fff" opacity=".6"/>
  <path d="M240 312q140-20 330-4" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".45"/>
  <rect x="226" y="320" width="22" height="12" rx="5" fill="#fdef42"/><rect x="560" y="322" width="16" height="12" rx="5" fill="#ff8a3d" opacity=".9"/>
  <circle cx="296" cy="366" r="30" fill="#1a2433"/><circle cx="296" cy="366" r="14" fill="#dfe6ee"/><circle cx="296" cy="366" r="5" fill="#1a2433"/>
  <circle cx="512" cy="366" r="30" fill="#1a2433"/><circle cx="512" cy="366" r="14" fill="#dfe6ee"/><circle cx="512" cy="366" r="5" fill="#1a2433"/>
  <!-- price tag -->
  <path d="M640 120l6 70" stroke="#1a2433" stroke-width="2.5"/>
  <g transform="rotate(14 680 220)">
    <path d="M630 196l26-26h92a12 12 0 0 1 12 12v76a12 12 0 0 1-12 12h-92l-26-26Z" fill="url(#vente-vehicules-tag)"/>
    <circle cx="652" cy="220" r="8" fill="#fff"/>
    <rect x="680" y="200" width="60" height="10" rx="5" fill="#fff" opacity=".9"/>
    <rect x="680" y="220" width="40" height="8" rx="4" fill="#fff" opacity=".6"/>
    <rect x="680" y="236" width="50" height="8" rx="4" fill="#fff" opacity=".6"/>
  </g>
  <!-- key -->
  <g transform="rotate(-20 120 190)">
    <rect x="70" y="160" width="70" height="56" rx="18" fill="#1a2433"/>
    <circle cx="94" cy="188" r="7" fill="#00853f"/><circle cx="116" cy="188" r="7" fill="#e31b23"/>
    <rect x="140" y="180" width="80" height="16" rx="4" fill="#b6c3d1"/>
    <path d="M190 196v10h8v-10M206 196v14h8v-14" fill="#b6c3d1"/>
